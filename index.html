<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกการสังเกตกราฟทอง</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f1ea; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fffdf9; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); position: relative; }
        .status-bar { text-align: right; font-size: 14px; margin-bottom: 10px; font-weight: bold; color: #555; }
        .section-title { font-weight: bold; margin-top: 20px; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
        input, select, textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        input[type="date"] { width: 150px; }
        .input-group { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; width: 100%; }
        .input-group input { flex-grow: 1; }
        .image-box { border: 2px dashed #ccc; padding: 20px; text-align: center; border-radius: 6px; background: #faf8f5; color: #777; margin-bottom: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <!-- สถานะการซิงค์ -->
    <div id="syncStatus" class="status-bar">⚪ กำลังเชื่อมต่อ...</div>

    <div class="form-row">
        <label><b>Date :</b></label>
        <input type="date" id="dateInput">
    </div>

    <h2>บันทึกการสังเกตกราฟทอง ⭐</h2>

    <div class="form-row">
        <span>เทคนิค</span>
        <select id="techSelect">
            <option value="SMC">SMC</option>
            <option value="Price Action">Price Action</option>
            <option value="Supply & Demand">Supply & Demand</option>
        </select>
        <span>TF</span>
        <select id="tfSelect">
            <option value="1m">1m</option>
            <option value="5m">5m</option>
            <option value="15m">15m</option>
            <option value="1h">1h</option>
        </select>
    </div>

    <div class="section-title">📊 รูปกราฟที่สังเกต (ย้อนหลัง / Backtest)</div>
    <div class="image-box" onclick="document.getElementById('imageInput').click()">
        คลิกเพื่ออัปโหลดหรือวางรูปกราฟ 16:9
        <input type="file" id="imageInput" accept="image/*" style="display:none">
    </div>
    <div id="imagePreviewContainer" style="margin-bottom: 15px; text-align: center;"></div>

    <div class="section-title">📍 จุดสังเกต</div>
    <div id="observationList">
        <div class="input-group"><span>1.</span><input type="text" class="obs-item" placeholder="กรอกจุดสังเกต..."></div>
        <div class="input-group"><span>2.</span><input type="text" class="obs-item" placeholder="กรอกจุดสังเกต..."></div>
        <div class="input-group"><span>3.</span><input type="text" class="obs-item" placeholder="กรอกจุดสังเกต..."></div>
    </div>

    <div class="section-title">⚠️ จุดระวัง</div>
    <div id="warningList">
        <div class="input-group"><span>1.</span><input type="text" class="warn-item" placeholder="กรอกจุดระวัง..."></div>
    </div>

    <div class="section-title">📝 บันทึกเพิ่มเติม</div>
    <textarea id="noteInput" rows="4" style="width: 100%;" placeholder="บันทึกรายละเอียดเพิ่มเติม..."></textarea>
</div>

<script>
    // ⚠️ ใส่ URL ของ Google Apps Script ของคุณที่นี่เครื่องหมายคำพูด (Keep quotes)
    const WEB_APP_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

    let isLoaded = false;

    // 1. โหลดข้อมูลจาก Google Sheets ทันทีเมื่อเปิดเว็บ (ทุกเครื่องจะเห็นข้อมูลตรงกัน)
    window.addEventListener('DOMContentLoaded', async () => {
        const statusEl = document.getElementById('syncStatus');
        try {
            statusEl.innerText = "⏳ กำลังโหลดข้อมูล...";
            let response = await fetch(WEB_APP_URL);
            let data = await response.json();

            if (data && typeof data === 'object') {
                if (data.date) document.getElementById('dateInput').value = data.date;
                if (data.tech) document.getElementById('techSelect').value = data.tech;
                if (data.tf) document.getElementById('tfSelect').value = data.tf;
                if (data.note) document.getElementById('noteInput').value = data.note;
                if (data.imageBase64) {
                    document.getElementById('imagePreviewContainer').innerHTML = `<img src="${data.imageBase64}" style="max-width:100%; border-radius:6px;">`;
                }

                // โหลดจุดสังเกต
                if (Array.isArray(data.observations)) {
                    const obsInputs = document.querySelectorAll('.obs-item');
                    data.observations.forEach((val, index) => {
                        if (obsInputs[index]) obsInputs[index].value = val;
                    });
                }

                // โหลดจุดระวัง
                if (Array.isArray(data.warnings)) {
                    const warnInputs = document.querySelectorAll('.warn-item');
                    data.warnings.forEach((val, index) => {
                        if (warnInputs[index]) warnInputs[index].value = val;
                    });
                }
            }

            statusEl.innerText = "🟢 ซิงค์ข้อมูลกับ Google Sheets สำเร็จ";
            statusEl.style.color = "green";
            isLoaded = true;
        } catch (error) {
            console.error("Load error:", error);
            statusEl.innerText = "🔴 โหลดข้อมูลไม่สำเร็จ";
            statusEl.style.color = "red";
            isLoaded = true;
        }
    });

    // 2. ฟังก์ชันส่งข้อมูลไปบันทึกที่ Google Sheets แบบ Real-time เมื่อมีการเปลี่ยนแปลง
    async function saveData() {
        if (!isLoaded) return; // ป้องกันการบันทึกทับข้อมูลตอนกำลังโหลดครั้งแรก

        const statusEl = document.getElementById('syncStatus');
        statusEl.innerText = "💾 กำลังบันทึก...";
        statusEl.style.color = "orange";

        // รวบรวมข้อมูลทั้งหมดในหน้าเว็บ
        const observations = Array.from(document.querySelectorAll('.obs-item')).map(input => input.value);
        const warnings = Array.from(document.querySelectorAll('.warn-item')).map(input => input.value);
        const imgEl = document.querySelector('#imagePreviewContainer img');
        
        const payload = {
            date: document.getElementById('dateInput').value,
            tech: document.getElementById('techSelect').value,
            tf: document.getElementById('tfSelect').value,
            note: document.getElementById('noteInput').value,
            observations: observations,
            warnings: warnings,
            imageBase64: imgEl ? imgEl.src : ''
        };

        try {
            let response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            let result = await response.json();

            if (result.status === 'success') {
                statusEl.innerText = "🟢 บันทึกข้อมูลลง Google Sheets เรียบร้อย";
                statusEl.style.color = "green";
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            console.error("Save error:", error);
            statusEl.innerText = "🔴 บันทึกไม่สำเร็จ";
            statusEl.style.color = "red";
        }
    }

    // จัดการอัปโหลดรูปภาพแปลงเป็น Base64 เพื่อเก็บลง Sheets ได้ทันที
    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                document.getElementById('imagePreviewContainer').innerHTML = `<img src="${uploadEvent.target.result}" style="max-width:100%; border-radius:6px;">`;
                saveData(); // บันทึกอัตโนมัติหลังใส่รูป
            };
            reader.readAsDataURL(file);
        }
    });

    // สั่งบันทึกอัตโนมัติทุกครั้งที่มีการพิมพ์หรือเปลี่ยนค่าฟอร์ม
    document.querySelectorAll('input, select, textarea').forEach(element => {
        element.addEventListener('input', () => {
            clearTimeout(window.saveTimer);
            window.saveTimer = setTimeout(saveData, 1000); // หน่วงเวลา 1 วิ เพื่อไม่ให้ยิงรัวเกินไป
        });
    });
</script>

</body>
</html>
