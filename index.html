<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โปรแกรมคำนวณและบันทึกค่าใช้จ่ายรายเดือน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', 'Inter', 'sans-serif'], num: ['Inter', 'Prompt', 'sans-serif'] },
          colors: { brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' } }
        }
      }
    }
  </script>
  <style>
    body { background-color: #f8fafc; color: #1e293b; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
    .tab-active { border-bottom: 2px solid #0284c7; color: #0284c7; font-weight: 600; }
  </style>
</head>
<body class="antialiased pb-20">

  <!-- Top Navbar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-brand-600 text-white flex items-center justify-center shadow-sm">
          <i data-lucide="wallet" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-slate-800 leading-tight">จัดการงบ & บันทึกบัญชี</h1>
          <p class="text-[11px] text-slate-500 flex items-center gap-1" id="syncStatusText">
            <span class="w-2 h-2 rounded-full bg-sky-500 animate-pulse inline-block"></span> กำลังเชื่อมต่อ Google Sheets...
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openSettingsModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition">
          <i data-lucide="settings" class="w-3.5 h-3.5"></i> ตั้งค่า URL ชีท
        </button>
        <button onclick="saveToGoogleSheets()" id="btnSaveCloud" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg
